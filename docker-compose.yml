# Orchestration complète : API + interface + monitoring.
# Démarrage : docker compose up --build
#   API        -> http://localhost:8000/docs
#   Streamlit  -> http://localhost:8501
#   Prometheus -> http://localhost:9090
#   Grafana    -> http://localhost:3001  (admin / admin)

services:
  api:
    build: .
    image: valve-app:latest
    container_name: valve-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  streamlit:
    image: valve-app:latest
    container_name: valve-streamlit
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    container_name: valve-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: valve-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
