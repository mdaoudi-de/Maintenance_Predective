name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt ruff

      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true

      - name: Tests (pytest)
        # Les tests dépendant des données/du modèle sont ignorés proprement
        # s'ils sont absents (data + modèle versionnés via DVC, non présents en CI).
        run: pytest -q

  docker-build:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image de service
        run: docker build -t valve-app:ci .
